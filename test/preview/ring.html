<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>侧栏底部的重启方块预览</title>
<style>
  /* Tokens copied from the running app, not invented: the host's brand color is
     neutral (near-black in light, near-white in dark), never blue. Dark is the
     default here because that is the theme this fixture exists to check. */
  :root {
    --dsw-radius-sm: 8px; --dsw-radius-md: 12px;
    --dsw-elevation-prominent: 0 0 0 0.5px rgba(255,255,255,0.1), 0 3px 8px rgba(0,0,0,0.28), 0 0 20px rgba(0,0,0,0.32);
    --dsw-alias-bg-base: #151517;
    --dsw-alias-bg-layer-1: #232324;
    --dsw-alias-bg-layer-2: #2c2c2e;
    --dsw-alias-bg-overlay: #353638;
    --dsw-alias-border-l1: #ffffff0f;
    --dsw-alias-border-l2: #ffffff1f;
    --dsw-alias-border-l3: #ffffff29;
    --dsw-alias-border-l4: #ffffff33;
    --dsw-alias-label-primary: #f9fafb;
    --dsw-alias-label-secondary: #cfd3d6;
    --dsw-alias-label-tertiary: #adb2b8;
    --dsw-alias-brand-primary: #f9fafb;
    --dsw-alias-button-primary-fill: #f9fafb;
    --dsw-alias-button-primary-hover: #ebeef2;
    --dsw-alias-label-primary-foreground: #0f1115;
    --dsw-alias-bg-module-platform: #353638;
    --dsw-alias-interactive-bg-hover: #ffffff14;
    --dsw-alias-interactive-bg-hover-solid: #353638;
    --dsw-alias-state-success-primary: #22c55e;
    --dsw-alias-state-warn-primary: #f59e0b;
    --dsw-alias-state-error-primary: #f25a5a;
    --dsw-alias-state-idle-primary: #81858c;
  }
  :root[data-theme="light"] {
    --dsw-elevation-prominent: 0 0 0 0.5px rgba(0,0,0,0.08), 0 3px 8px rgba(0,0,0,0.04), 0 0 20px rgba(0,0,0,0.05);
    --dsw-alias-bg-base: #ffffff;
    --dsw-alias-bg-layer-1: #ffffff;
    --dsw-alias-bg-layer-2: #f9fafb;
    --dsw-alias-bg-overlay: #ffffff;
    --dsw-alias-border-l1: #0000000a;
    --dsw-alias-border-l2: #0000001a;
    --dsw-alias-border-l3: #0000001f;
    --dsw-alias-border-l4: #00000029;
    --dsw-alias-label-primary: #0f1115;
    --dsw-alias-label-secondary: #61666b;
    --dsw-alias-label-tertiary: #81858c;
    --dsw-alias-brand-primary: #0f1115;
    --dsw-alias-button-primary-fill: #0f1115;
    --dsw-alias-button-primary-hover: #43454a;
    --dsw-alias-label-primary-foreground: #ffffff;
    --dsw-alias-bg-module-platform: #f5f6f7;
    --dsw-alias-interactive-bg-hover: #2631480f;
    --dsw-alias-interactive-bg-hover-solid: #f1f3f5;
    --dsw-alias-state-success-primary: #22c55e;
    --dsw-alias-state-warn-primary: #f59e0b;
    --dsw-alias-state-error-primary: #ec1313;
    --dsw-alias-state-idle-primary: #979da6;
  }
  body {
    margin: 0; padding: 40px; background: var(--dsw-alias-bg-base);
    font-family: -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
  }
  /* Stand-in for the sidebar foot, measured off the running app: the sidebar is a
     6px/8px padded surface, the action seat is a 264x44 row, and the account row
     below it is a 260x44 button with 6px padding. Getting these numbers right is
     the whole point of this fixture — a wrong mock hides a wrong button. */
  .rh-mock {
    position: relative; width: 280px; padding: 6px 8px 10px; box-sizing: border-box;
    background: var(--dsw-alias-bg-layer-2); border-radius: 14px;
    display: flex; flex-direction: column;
  }
  .rh-list { height: 84px; border-radius: 8px; background: var(--dsw-alias-bg-layer-1); opacity: 0.4; }
  /* Block, not flex: the host's footerActions is a stretch-aligned flex column,
     so its child spans the full width. A flex parent here would shrink-wrap the
     seat to its contents and hide the geometry this fixture exists to check. */
  .rh-action { display: block; width: 100%; margin-top: 8px; }
  /* The account button sits inset 2px from the row (260 of 264 wide), which is
     what puts its avatar on the same axis as the seat's icon. */
  .rh-account {
    display: flex; align-items: center; gap: 8px; width: calc(100% - 4px); height: 44px;
    margin: 4px 2px 0; padding: 6px; box-sizing: border-box;
    border: 0; border-radius: 12px; cursor: pointer;
    background: transparent; color: var(--dsw-alias-label-primary);
    font-family: inherit; font-size: 14px; text-align: left;
  }
  .rh-account:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .rh-avatar {
    width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: var(--dsw-alias-bg-layer-1); color: var(--dsw-alias-label-secondary);
    font-size: 11px;
  }
  .rh-name { flex: 1; }
  #ring { display: block; }
</style>
</head>
<body>
<div class="rh-mock">
  <div class="rh-list"></div>
  <div class="rh-action"><div id="ring"></div></div>
  <button class="rh-account" type="button">
    <span class="rh-avatar">👤</span><span class="rh-name">186****16</span>
  </button>
</div>
<script>
window.__errors = [];
window.addEventListener("error", (e) => window.__errors.push(String(e && e.message)));
window.addEventListener("unhandledrejection", (e) => window.__errors.push("rej:" + String(e && e.reason && e.reason.stack || e.reason)));
</script>
<script type="module">
import { createElement, mount, useState, useReducer, useRef, useEffect, useCallback, useMemo } from "./mini-react.js";

const params = new URLSearchParams(location.search);
if (params.get("theme") === "light") document.documentElement.dataset.theme = "light";
const scenario = params.get("s") || "idle";
const now = Date.now();

const base = {
  desktop: true,
  settings: { autoRestart: true },
  bootedAt: now - 1000 * 60 * 42,
  countdown: { active: false },
  deferred: { active: false },
  handoff: { active: false },
  busy: { count: 0 },
};
const scenarios = {
  idle: base,
  countdown: { ...base, countdown: { active: true, restartAt: now + 3200, totalMs: 5000 } },
  waiting: { ...base, deferred: { active: true, reason: "plugin-manager: host-module" } },
  reconnect: base,
};
window.__SCENARIO__ = scenarios[scenario];
base.boot = { pid: 1111 };

// "reconnect": fake a restart — the endpoint goes away, comes back with a new
// boot pid, and the page paints the shell's reconnect wording for a while.
let restartedAt = 0;
if (scenario === "reconnect") {
  const banner = document.createElement("div");
  banner.style.cssText =
    "position:fixed;top:10px;left:50%;transform:translateX(-50%);font:12px/1.4 -apple-system,sans-serif;color:#b8860b";
  document.body.appendChild(banner);
  setInterval(() => {
    if (!restartedAt) return;
    const dt = Date.now() - restartedAt;
    const stuck = params.get("stuck") === "1";
    banner.textContent = dt < 7000 ? "重新连接中…" : stuck ? "已连接" : dt < 8500 ? "连接成功" : "";
  }, 100);
  window.__restartedAt = () => restartedAt;
}
window.fetch = async (url, init) => {
  if (init && init.method === "POST") {
    restartedAt = Date.now();
    return { ok: true, json: async () => ({ ok: true }) };
  }
  if (restartedAt) {
    const dt = Date.now() - restartedAt;
    if (dt < 5000) throw new Error("offline");
    return { ok: true, json: async () => ({ ...window.__SCENARIO__, boot: { pid: 2222 } }) };
  }
  return { ok: true, json: async () => window.__SCENARIO__ };
};

const React = { createElement, useState, useReducer, useRef, useEffect, useCallback, useMemo };
let captured = null;
window.__ModuleLoader__ = { load: (spec) => { captured = spec.factory(() => React); } };
await import("../../client.js");

const registry = {};
captured.apply({ slots: { inject: (_name, fn) => fn(), register: (meta, component) => { registry[meta.name] = component; return () => {}; } } });
mount(registry["sidebar.footer.action"], document.getElementById("ring"));
</script>
</body>
</html>
