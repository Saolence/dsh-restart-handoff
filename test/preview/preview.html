<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>重启交接面板预览</title>
<style>
  /* Host tokens, copied from the desktop app's design platform (light first,
     then the dark block) so a screenshot here looks like the real settings page. */
  :root {
    --dsw-radius-xs: 4px; --dsw-radius-sm: 8px; --dsw-radius-md: 12px; --dsw-radius-lg: 16px;
    --dsw-elevation-prominent: 0 0 0 0.5px rgba(0,0,0,0.08), 0 3px 8px rgba(0,0,0,0.04), 0 0 20px rgba(0,0,0,0.05);
    --dsw-focus-ring-width: 2px;
    --dsw-alias-state-business-primary: rgb(86, 134, 254);
    --dsw-alias-bg-base: rgb(255, 255, 255);
    --dsw-alias-bg-layer-1: rgb(255, 255, 255);
    --dsw-alias-bg-layer-2: rgb(249, 250, 251);
    --dsw-alias-bg-layer-3: rgb(255, 255, 255);
    --dsw-alias-bg-overlay: rgb(255, 255, 255);
    --dsw-alias-border-l1: rgba(0, 0, 0, 0.04);
    --dsw-alias-border-l2: rgba(0, 0, 0, 0.1);
    --dsw-alias-border-l3: rgba(0, 0, 0, 0.12);
    --dsw-alias-border-l4: rgba(0, 0, 0, 0.16);
    --dsw-alias-label-primary: rgb(15, 17, 21);
    --dsw-alias-label-secondary: rgb(97, 102, 107);
    --dsw-alias-label-tertiary: rgb(129, 133, 140);
    --dsw-alias-label-caption: rgb(129, 133, 140);
    --dsw-alias-brand-primary: rgb(15, 17, 21);
    --dsw-alias-interactive-bg-hover: rgba(38, 49, 72, 0.06);
    --dsw-alias-state-success-primary: rgb(34, 197, 94);
    --dsw-alias-state-warn-primary: rgb(245, 158, 11);
    --dsw-alias-state-error-primary: rgb(236, 19, 19);
    --dsw-alias-state-idle-primary: rgb(151, 157, 166);
  }
  :root[data-theme="dark"] {
    --dsw-elevation-prominent: 0 0 0 0.5px rgba(255,255,255,0.1), 0 3px 8px rgba(0,0,0,0.28), 0 0 20px rgba(0,0,0,0.32);
    --dsw-alias-bg-base: rgb(21, 21, 23);
    --dsw-alias-bg-layer-1: rgb(35, 35, 36);
    --dsw-alias-bg-layer-2: rgb(44, 44, 46);
    --dsw-alias-bg-layer-3: rgb(53, 54, 56);
    --dsw-alias-bg-overlay: rgb(53, 54, 56);
    --dsw-alias-border-l1: rgba(255, 255, 255, 0.06);
    --dsw-alias-border-l2: rgba(255, 255, 255, 0.12);
    --dsw-alias-border-l3: rgba(255, 255, 255, 0.16);
    --dsw-alias-border-l4: rgba(255, 255, 255, 0.2);
    --dsw-alias-label-primary: rgb(249, 250, 251);
    --dsw-alias-label-secondary: rgb(207, 211, 214);
    --dsw-alias-label-tertiary: rgb(173, 178, 184);
    --dsw-alias-label-caption: rgb(173, 178, 184);
    --dsw-alias-brand-primary: rgb(249, 250, 251);
    --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, 0.08);
    --dsw-alias-state-error-primary: rgb(242, 90, 90);
    --dsw-alias-state-idle-primary: rgb(129, 133, 140);
  }
  body {
    margin: 0; padding: 28px; background: var(--dsw-alias-bg-layer-2);
    font-family: -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
  }
  /* the preview re-mounts the whole tree on every tick; keep the entrance
     animation from restarting mid-screenshot */
  .ar-card--count { animation: none !important; }
  #root { width: 760px; background: var(--dsw-alias-bg-base); padding: 20px 24px; border-radius: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { createElement, mount } from "./mini-react.js?v=7";

const params = new URLSearchParams(location.search);
if (params.get("theme") === "dark") document.documentElement.dataset.theme = "dark";
const scenario = params.get("s") || "idle";
const now = Date.now();
const DEFAULT_TEMPLATE = '## DSH 已重启完成 · {{time}}\n\n- 起因：{{reason}}\n\n- 做到哪了：{{progress}}\n\n- 接下来第一步：{{next}}\n\n- 不用重做：{{skip}}';

const SAMPLE_PREVIEW = [
  "## DSH 已重启完成 · 14:55",
  "",
  "- 起因：你说过设置页要更像 DSH",
  "",
  "- 做到哪了：模板编辑器和弹窗都按宿主的行距重做了",
  "",
  "- 接下来第一步：看一眼截图，确认没有别扭的地方",
  "",
  "- 不用重做：不用再跑测试",
].join("\n");

const base = {
  desktop: true,
  defaultTemplate: DEFAULT_TEMPLATE,
  templateFields: ["reason", "progress", "next", "skip", "session", "time"],
  preview: SAMPLE_PREVIEW,
  settings: { autoRestart: true, toolEnabled: true, resumeAfterRestart: true, deferUntilIdle: true, graceMs: 5000 },
  bootedAt: now - 1000 * 60 * 42,
  logPath: "/Users/you/.dsh/restart-handoff.log",
  appPath: "/Applications/DeepSeek Harness.app",
  countdown: { active: false },
  deferred: { active: false },
  handoff: { active: false },
  history: [
    { time: now - 1000 * 60 * 3, kind: "resumed", attempts: 1 },
    { time: now - 1000 * 60 * 3 - 9000, kind: "restarting", reason: "plugin-manager: host-module" },
    { time: now - 1000 * 60 * 3 - 14000, kind: "scheduled", reason: "plugin-manager: host-module", delayMs: 5000 },
    { time: now - 1000 * 60 * 40, kind: "cancelled", reason: "plugin-manager: package-moved", by: "panel" },
    { time: now - 1000 * 60 * 90, kind: "deferred", reason: "restart_and_continue" },
  ],
};

const scenarios = {
  idle: base,
  countdown: { ...base, countdown: { active: true, restartAt: now + 3200, totalMs: 5000, reason: "plugin-manager: host-module" } },
  waiting: { ...base, deferred: { active: true, reason: "plugin_manager 安装后需要重启", sessionId: "s1" } },
  handoff: { ...base, handoff: { active: true, reason: "plugin-manager: no-hmr", sessionId: "s1" } },
  empty: { ...base, history: [], countdown: { active: false } },
};

window.__SCENARIO__ = scenarios[scenario];
window.fetch = async (url) => {
  const dbg = window.__dbg || (window.__dbg = { steps: [], errors: [] });
  dbg.steps.push("fetch:" + String(url));
  return {
    ok: true,
    json: async () => {
      dbg.steps.push("json:" + String(url));
      if (String(url).includes("/restart") && params.get("post") === "cooldown") {
        return { ok: true, scope: "restart", status: "cooldown", retryInMs: 42000 };
      }
      if (!String(url).includes("status")) return { ok: true, settings: window.__SCENARIO__.settings };
      const live = Object.assign({}, window.__SCENARIO__);
      if (live.countdown && live.countdown.active) {
        live.countdown = Object.assign({}, live.countdown, { restartAt: Date.now() + 3200 });
      }
      return live;
    },
  };
};

let panel = null;
window.__ModuleLoader__ = {
  load(spec) {
    const mod = spec.factory((name) => {
      if (name === "react") return { createElement, Fragment: "#frag",
        useState: null };
      throw new Error(name);
    });
    panel = mod;
  },
};
</script>
<script>
// client.js 是普通脚本，直接 eval 到 window 上，方便拿到 __ModuleLoader__.load
</script>
<script type="module">
import { createElement, Fragment, mount, useState, useReducer, useRef, useEffect, useCallback, useMemo } from "./mini-react.js?v=7";
const React = { createElement, Fragment, useState, useReducer, useRef, useEffect, useCallback, useMemo };
const params = new URLSearchParams(location.search);
let captured = null;
window.__ModuleLoader__ = { load: (spec) => { captured = spec.factory(() => React); } };
await import("../../client.js");
window.__panel = captured;
let comp = null;
const bySlot = {};
window.__dbg = { steps: [], errors: [] };
const origFetch = window.fetch;
window.__dbg.calls = [];
window.fetch = (...a) => { window.__dbg.calls.push(String(a[0])); return origFetch(...a); };
try {
  captured.apply({ slots: { inject: (_n, fn) => fn(), register: (meta, c) => { bySlot[meta.name] = c; return () => {}; } } });
  comp = bySlot[params.get("slot") || "settings.section"];
  window.__dbg.steps.push("applied:" + typeof comp);
  mount(comp, document.getElementById("root"));
  window.__dbg.steps.push("mounted");
} catch (e) {
  window.__dbg.errors.push(String(e && e.stack || e));
}
</script>
</body>
</html>
